name: ACE monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos
  workflow_dispatch:         # permite ejecutarlo a mano

permissions:
  contents: write            # necesario para guardar jobs.db

concurrency:
  group: ace-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ejecutar monitor
        env:
          ACE_API_KEY: ${{ secrets.ACE_API_KEY }}
          ACE_EMAIL: ${{ secrets.ACE_EMAIL }}
          ACE_PASSWORD: ${{ secrets.ACE_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python monitor.py
      - name: Guardar jobs.db
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add jobs.db
          if git diff --cached --quiet; then
            echo "Sin cambios en jobs.db"
            exit 0
          fi
          git commit -m "update jobs.db"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Reintento $i"
            sleep 5
          done
          exit 1
